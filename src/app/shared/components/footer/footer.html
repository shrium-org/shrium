<footer class="border-t border-border">
  <div
    class="mx-auto flex w-full max-w-content flex-col gap-8 px-5 py-10 sm:px-8 lg:px-10"
  >

    <div
      class="flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between"
    >
      <div>
        <a
          href="/"
          class="text-lg font-semibold tracking-tight text-text"
        >
          {{ profile.name }}
        </a>

        <p class="mt-2 text-sm text-text-muted">
          {{ profile.title }}
        </p>
      </div>

      <nav
        class="flex flex-wrap gap-x-6 gap-y-3"
        aria-label="Footer navigation"
      >
        @for (item of navigationItems; track item.fragment) {
          <a
            [href]="'#' + item.fragment"
            class="text-sm text-text-secondary transition-colors hover:text-text"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>

    <div
      class="flex flex-col gap-3 border-t border-border pt-6 text-sm text-text-muted sm:flex-row sm:items-center sm:justify-between"
    >
      <p>
        © {{ currentYear }} {{ profile.name }}. All rights reserved.
      </p>

      <a
        href="#"
        class="transition-colors hover:text-text"
      >
        Back to top ↑
      </a>
    </div>

  </div>
</footer>
