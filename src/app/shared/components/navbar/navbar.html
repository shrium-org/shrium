<header
  class="sticky top-0 z-50 border-b border-border bg-background/90 backdrop-blur"
>
  <nav
    class="mx-auto flex h-16 w-full max-w-content items-center justify-between px-5 sm:px-8 lg:px-10"
    aria-label="Main navigation"
  >

    <!-- Brand -->
    <a
      href="/"
      class="text-lg font-semibold tracking-tight text-text"
      aria-label="Home"
    >
      Ajay Malah
    </a>

    <!-- Desktop navigation -->
    <div class="hidden items-center gap-8 md:flex">
      @for (item of navigationItems; track item.fragment) {
        <a
          [href]="'#' + item.fragment"
          class="text-sm text-text-secondary transition-colors hover:text-text"
        >
          {{ item.label }}
        </a>
      }

      <app-theme-switcher />
    </div>

    <!-- Mobile controls -->
    <div class="flex items-center gap-2 md:hidden">

      <app-theme-switcher />

      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-full text-text"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMobileMenu()"
      >
        <span class="text-lg">
          {{ mobileMenuOpen() ? '×' : '☰' }}
        </span>
      </button>

    </div>
  </nav>

  <!-- Mobile navigation -->
  @if (mobileMenuOpen()) {
    <div class="border-t border-border md:hidden">
      <div class="mx-auto flex w-full max-w-content flex-col px-5 py-4 sm:px-8">

        @for (item of navigationItems; track item.fragment) {
          <a
            [href]="'#' + item.fragment"
            class="border-b border-border-subtle py-4 text-sm text-text-secondary hover:text-text"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>
        }

      </div>
    </div>
  }
</header>
