<section class="py-16 border-b"
         style="border-color:var(--color-border)">

  <!-- Header -->
  <div class="mb-10">

    <h2 class="font-heading text-3xl mb-3"
        style="color:var(--color-foreground)">
      Technical Skills
    </h2>

    <p class="text-sm"
       style="color:var(--color-foreground-muted)">
      Technologies and tools I use to build scalable applications.
    </p>

  </div>


  <!-- Skills Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


    @for (group of skills(); track group.id) {

      <div
        class="rounded-xl p-6 transition"
        style="
          background:var(--color-surface-2);
          border:1px solid var(--color-border)
        ">


        <!-- Category -->
        <h3 class="text-sm font-semibold uppercase tracking-widest mb-5"
            style="color:var(--color-primary)">
          {{ group.category }}
        </h3>


        <!-- Skill badges -->
        <div class="flex flex-wrap gap-2">

          @for(skill of group.skills; track skill) {

            <span
              class="px-3 py-1.5 rounded-md text-xs font-medium"
              style="
                background:var(--color-background);
                border:1px solid var(--color-border);
                color:var(--color-foreground-muted)
              ">
              {{ skill }}
            </span>

          }

        </div>


      </div>

    }


  </div>

</section>
