<section class="py-16 border-b"
         style="border-color:var(--color-border)">


  <!-- Header -->
  <div class="mb-10">

    <h2 class="font-heading text-3xl mb-3"
        style="color:var(--color-foreground)">
      Certifications
    </h2>

    <p class="text-sm"
       style="color:var(--color-foreground-muted)">
      Professional certifications and continuous learning.
    </p>

  </div>



  <!-- Certification Grid -->

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


    @for(cert of certifications; track cert.id) {


      <div
        class="rounded-xl p-6 flex flex-col"
        style="
          background:var(--color-surface-2);
          border:1px solid var(--color-border)
        ">



        <!-- Title -->

        <h3 class="text-lg font-semibold mb-2"
            style="color:var(--color-foreground)">
          {{ cert.name }}
        </h3>



        <!-- Issuer -->

        <div class="flex items-center gap-2 text-sm mb-4"
             style="color:var(--color-primary)">

          <i class="ti ti-certificate"></i>

          {{ cert.issuer }}

        </div>




        <!-- Date -->

        <div class="flex items-center gap-2 text-xs mb-5"
             style="color:var(--color-foreground-muted)">

          <i class="ti ti-calendar"></i>

          Issued {{ cert.issueDate }}

        </div>




        <!-- Skills -->

        <div class="flex flex-wrap gap-2 mb-6">


          @for(skill of cert.skills; track skill) {


            <span
              class="px-3 py-1.5 rounded-md text-xs"
              style="
                background:var(--color-background);
                border:1px solid var(--color-border);
                color:var(--color-foreground-muted)
              ">

              {{ skill }}

            </span>


          }


        </div>




        <!-- Credential -->

        @if(cert.credentialUrl) {

          <a
            [href]="cert.credentialUrl"
            target="_blank"
            rel="noopener"
            class="mt-auto inline-flex items-center gap-2 text-xs"
            style="color:var(--color-primary)">

            <i class="ti ti-external-link"></i>

            View Credential

          </a>

        }


      </div>


    }


  </div>


</section>
