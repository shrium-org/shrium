<section class="py-16 border-b"
         style="border-color:var(--color-border)">


  <!-- Header -->
  <div class="mb-10">

    <h2 class="font-heading text-3xl mb-3"
        style="color:var(--color-foreground)">
      Education
    </h2>

    <p class="text-sm"
       style="color:var(--color-foreground-muted)">
      Academic background and qualifications.
    </p>

  </div>



  <!-- Education Cards -->

  <div class="grid grid-cols-1 gap-5">


    @for(item of education(); track item.id) {


      <div
        class="rounded-xl p-6"
        style="
          background:var(--color-surface-2);
          border:1px solid var(--color-border)
        ">


        <!-- Degree -->
        <div class="flex flex-col md:flex-row md:justify-between gap-3 mb-4">


          <div>

            <h3 class="text-lg font-semibold"
                style="color:var(--color-foreground)">
              {{ item.degree }}
            </h3>


            <p class="text-sm"
               style="color:var(--color-primary)">
              {{ item.fieldOfStudy }}
            </p>

          </div>



          <div class="text-xs"
               style="color:var(--color-foreground-muted)">

            {{ item.startDate }}
            -
            {{ item.endDate }}

          </div>


        </div>



        <!-- Institution -->

        <div class="space-y-2 text-sm"
             style="color:var(--color-foreground-muted)">


          <div class="flex items-center gap-2">

            <i class="ti ti-school"
               style="color:var(--color-primary)">
            </i>

            {{ item.institution }}

          </div>



          <div class="flex items-center gap-2">

            <i class="ti ti-map-pin"
               style="color:var(--color-primary)">
            </i>

            {{ item.location }}

          </div>



          <div class="flex items-center gap-2">

            <i class="ti ti-award"
               style="color:var(--color-primary)">
            </i>

            {{ item.grade }}

          </div>


        </div>


      </div>


    }


  </div>


</section>
