<section
  id="contact"
  class="border-b border-border py-20 sm:py-28 lg:py-32"
>
  <div
    class="mx-auto w-full max-w-content px-5 sm:px-8 lg:px-10"
  >
    <div
      class="grid gap-12 lg:grid-cols-[1fr_0.8fr] lg:items-end"
    >

      <div>
        <p
          class="text-sm font-medium uppercase tracking-[0.2em] text-text-muted"
        >
          Contact
        </p>

        <h2
          class="mt-4 max-w-2xl text-3xl font-semibold tracking-tight text-text sm:text-4xl lg:text-5xl"
        >
          {{ contact.heading }}
        </h2>

        <p
          class="mt-6 max-w-2xl text-lg leading-8 text-text-secondary"
        >
          {{ contact.description }}
        </p>

        <a
          [href]="'mailto:' + contact.email"
          class="mt-8 inline-flex rounded-full bg-text px-6 py-3 text-sm font-medium text-background transition-opacity hover:opacity-80"
        >
          {{ contact.email }}
        </a>
      </div>

      <div class="lg:justify-self-end">
        <div class="flex flex-col gap-4">
          @for (link of contact.links; track link.label) {
            <a
              [href]="link.url"
              target="_blank"
              rel="noopener noreferrer"
              class="group flex items-center justify-between gap-8 border-b border-border py-4 text-text"
            >
              <span class="text-sm text-text-muted">
                {{ link.label }}
              </span>

              <span
                class="text-sm font-medium transition-opacity group-hover:opacity-60"
              >
                {{ link.value }} ↗
              </span>
            </a>
          }
        </div>
      </div>

    </div>
  </div>
</section>
