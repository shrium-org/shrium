<section
  class="flex min-h-[calc(100vh-4rem)] items-center border-b border-border"
>
  <div
    class="mx-auto w-full max-w-content px-5 py-24 sm:px-8 sm:py-32 lg:px-10"
  >

    <div class="max-w-4xl">

      <p class="mb-5 text-sm font-medium uppercase tracking-[0.2em] text-text-muted">
        {{ profile.availability }}
      </p>

      <h1
        class="text-5xl font-semibold tracking-tight text-text sm:text-6xl lg:text-7xl"
      >
        {{ profile.name }}
      </h1>

      <h2
        class="mt-4 text-2xl font-medium tracking-tight text-text-secondary sm:text-3xl"
      >
        {{ profile.title }}
      </h2>

      <p
        class="mt-8 max-w-2xl text-lg leading-8 text-text-secondary sm:text-xl"
      >
        {{ profile.introduction }}
      </p>

      <div class="mt-10 flex flex-wrap gap-4">

        <a
          [href]="'#' + profile.primaryAction.fragment"
          class="rounded-full bg-text px-6 py-3 text-sm font-medium text-background transition-opacity hover:opacity-80"
        >
          {{ profile.primaryAction.label }}
        </a>

        <a
          [href]="'#' + profile.secondaryAction.fragment"
          class="rounded-full border border-border px-6 py-3 text-sm font-medium text-text transition-colors hover:bg-surface"
        >
          {{ profile.secondaryAction.label }}
        </a>

      </div>

      <p class="mt-8 text-sm text-text-muted">
        {{ profile.location }}
      </p>

    </div>

  </div>
</section>
