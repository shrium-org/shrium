<section
  id="skills"
  class="border-b border-border py-20 sm:py-28 lg:py-32"
>
  <div
    class="mx-auto w-full max-w-content px-5 sm:px-8 lg:px-10"
  >

    <!-- Header -->

    <div class="max-w-2xl">
      <p
        class="text-sm font-medium uppercase tracking-[0.2em] text-text-muted"
      >
        Skills
      </p>

      <h2
        class="mt-4 text-3xl font-semibold tracking-tight text-text sm:text-4xl"
      >
        Technologies I work with.
      </h2>
    </div>


    <!-- Skill groups -->

    <div
      class="mt-12 grid gap-px overflow-hidden rounded-xl border border-border bg-border md:grid-cols-2"
    >

      @for (group of groups; track group.title) {

        <article
          class="bg-background p-6 sm:p-8"
        >

          <h3
            class="text-xl font-semibold tracking-tight text-text"
          >
            {{ group.title }}
          </h3>

          <p
            class="mt-3 text-sm leading-6 text-text-secondary"
          >
            {{ group.description }}
          </p>

          <div class="mt-6 flex flex-wrap gap-2">

            @for (skill of group.skills; track skill.name) {

              <span
                class="rounded-full border border-border px-3 py-1.5 text-sm text-text-secondary"
              >
                {{ skill.name }}
              </span>

            }

          </div>

        </article>

      }

    </div>

  </div>
</section>
