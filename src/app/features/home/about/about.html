<section
  id="about"
  class="border-b border-border py-20 sm:py-28 lg:py-32"
>
  <div
    class="mx-auto grid w-full max-w-content gap-12 px-5 sm:px-8 lg:grid-cols-[0.8fr_1.2fr] lg:px-10"
  >

    <!-- Section heading -->
    <div>
      <p
        class="text-sm font-medium uppercase tracking-[0.2em] text-text-muted"
      >
        About
      </p>

      <h2
        class="mt-4 max-w-md text-3xl font-semibold tracking-tight text-text sm:text-4xl"
      >
        {{ about.heading }}
      </h2>
    </div>

    <!-- Content -->
    <div class="max-w-2xl space-y-6">
      @for (paragraph of about.paragraphs; track paragraph) {
        <p
          class="text-lg leading-8 text-text-secondary"
        >
          {{ paragraph }}
        </p>
      }
    </div>

  </div>
</section>
