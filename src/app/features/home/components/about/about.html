<section
  id="about"
  class="border-b border-border py-20 sm:py-28 lg:py-32"
>
  <div
    class="mx-auto grid w-full max-w-content gap-12 px-5 sm:px-8 lg:grid-cols-[0.7fr_1.3fr] lg:gap-20 lg:px-10"
  >
    <!-- Section heading -->
    <div>
      <p class="text-xs font-medium uppercase tracking-[0.22em] text-text-muted">
        About
      </p>

      <h2
        class="mt-4 max-w-sm text-3xl font-semibold leading-tight tracking-[-0.03em] text-text sm:text-4xl"
      >
        {{ about.heading }}
      </h2>
    </div>

    <!-- Content -->
    <div class="max-w-3xl">
      <div class="space-y-7">
        @for (paragraph of about.paragraphs; track paragraph) {
          <p class="text-lg leading-8 text-text-secondary sm:text-xl sm:leading-9">
            {{ paragraph }}
          </p>
        }
      </div>

      <!-- Engineering focus -->
      <div class="mt-12 grid gap-3 sm:grid-cols-3">
        <div class="rounded-lg border border-border bg-surface p-5 transition-colors hover:border-border-strong">
          <p class="text-xs font-medium uppercase tracking-[0.18em] text-text-muted">
            Focus
          </p>
          <p class="mt-3 text-sm leading-6 text-text">
            Backend & distributed systems
          </p>
        </div>

        <div class="rounded-lg border border-border bg-surface p-5 transition-colors hover:border-border-strong">
          <p class="text-xs font-medium uppercase tracking-[0.18em] text-text-muted">
            Approach
          </p>
          <p class="mt-3 text-sm leading-6 text-text">
            Design from system to implementation
          </p>
        </div>

        <div class="rounded-lg border border-border bg-surface p-5 transition-colors hover:border-border-strong">
          <p class="text-xs font-medium uppercase tracking-[0.18em] text-text-muted">
            Interests
          </p>
          <p class="mt-3 text-sm leading-6 text-text">
            AI, cloud infrastructure & architecture
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
