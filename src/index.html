<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- Primary -->
  <title>Ajay Malah — Backend & Distributed Systems Engineer</title>
  <meta
    name="description"
    content="Portfolio of Ajay Malah, a backend engineer focused on distributed systems, cloud infrastructure, and AI. Explore projects, experience, and skills."
  >
  <meta name="author" content="Ajay Malah">
  <meta name="keywords" content="Ajay Malah, backend engineer, distributed systems, cloud infrastructure, software engineer, AI, portfolio">

  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">

  <link rel="canonical" href="https://[yourdomain.com]/">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ajay Malah">
  <meta property="og:title" content="Ajay Malah — Backend & Distributed Systems Engineer">
  <meta property="og:description" content="Portfolio of Ajay Malah, a backend engineer focused on distributed systems, cloud infrastructure, and AI.">
  <meta property="og:url" content="https://[yourdomain.com]/">
  <meta property="og:image" content="https://[yourdomain.com]/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ajay Malah — Backend & Distributed Systems Engineer">
  <meta name="twitter:description" content="Portfolio of Ajay Malah, a backend engineer focused on distributed systems, cloud infrastructure, and AI.">
  <meta name="twitter:image" content="https://[yourdomain.com]/og-image.png">
  <!-- <meta name="twitter:creator" content="@yourhandle"> -->

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Preconnect for font performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Structured data (helps Google show a rich result) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ajay Malah",
    "jobTitle": "Backend & Distributed Systems Engineer",
    "url": "https://[yourdomain.com]/",
    "sameAs": [
      "https://github.com/[yourusername]",
      "https://linkedin.com/in/[yourusername]"
    ]
  }
  </script>

  <!-- Initial theme -->
  <script>
    (() => {
      const storageKey = 'portfolio-theme';
      const storedTheme = localStorage.getItem(storageKey);

      const theme =
        storedTheme === 'light' ||
        storedTheme === 'dark' ||
        storedTheme === 'system'
          ? storedTheme
          : 'system';

      const isDark =
        theme === 'dark' ||
        (
          theme === 'system' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        );

      document.documentElement.classList.toggle('dark', isDark);
      document.documentElement.style.colorScheme =
        isDark ? 'dark' : 'light';
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>
</html>
